<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LinkGlove – Luva tradutora de LIBRAS</title>
<style>
:root{--bg:#0d1024;--surf:#161a36;--surf2:#1e2347;--line:#2c3260;--tx:#eef0fb;--mut:#9aa1cc;--acc:#ffb454;--ok:#5eead4;--bad:#ff7a8a}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;padding:16px;max-width:1100px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:8px 0 20px}
h1{font-size:1.6rem;letter-spacing:-.02em}
h1 small{display:block;font-size:.85rem;font-weight:400;color:var(--mut);letter-spacing:0}
h2{font-size:1.15rem;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surf2);color:var(--tx);padding:10px 16px;border-radius:10px}
button:hover{border-color:var(--acc)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.primary{background:var(--acc);color:#241600;border-color:var(--acc);font-weight:700}
#status{padding:8px 14px;border-radius:999px;background:var(--surf);border:1px solid var(--line);font-weight:600}
#status.on{color:var(--ok);border-color:var(--ok)}
#status.off{color:var(--bad)}
section{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.main{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:18px}
.big{background:var(--bg);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;min-height:220px;text-align:center}
.big span{font-size:clamp(4rem,18vw,8rem);font-weight:800;line-height:1;color:var(--acc);word-break:break-all}
.big small{color:var(--mut);margin-top:8px}
textarea{width:100%;min-height:150px;resize:vertical;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:1.3rem}
.tr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{font-size:.95rem;margin-bottom:6px}
.card p{font-size:1.2rem;min-height:2.4em;overflow-wrap:anywhere}
.card small{color:var(--mut)}
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.alpha div{background:var(--bg);border:1px solid var(--line);border-radius:10px;text-align:center;padding:12px 0;font-size:1.5rem;font-weight:700}
.alpha div.hit{background:var(--acc);color:#241600;border-color:var(--acc)}
.video{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--mut)}
input{flex:1;min-width:200px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
a{color:var(--acc)}
#warn{display:none;background:#3a1d2a;border:1px solid var(--bad);padding:10px 14px;border-radius:10px;margin-bottom:18px}
@media(max-width:720px){.main{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>LinkGlove<small>Luva inteligente tradutora de LIBRAS (ESP32)</small></h1>
  <div class="row">
    <span id="status" class="off">❌ Desconectado</span>
    <button id="btnConn" class="primary">Conectar via Bluetooth</button>
  </div>
</header>
<div id="warn"></div>

<section>
  <div class="main">
    <div class="big" aria-live="polite">
      <span id="letter">–</span>
      <small>Letra / gesto detectado</small>
    </div>
    <div>
      <h2>Texto formado</h2>
      <textarea id="text" aria-label="Texto formado pela luva" placeholder="As letras recebidas da luva aparecem aqui..."></textarea>
      <div class="row" style="margin-top:10px">
        <button id="btnClear">Limpar Texto</button>
        <button id="btnVoice">🔊 Voz: Ativada</button>
        <button id="btnSpeakAll">Ler texto</button>
      </div>
    </div>
  </div>
</section>

<section>
  <h2>Tradução em tempo real</h2>
  <div class="tr" id="tr"></div>
</section>

<section>
  <h2>Alfabeto manual (A–Z)</h2>
  <div class="alpha" id="alpha"></div>
</section>

<section>
  <h2>Videoaulas de LIBRAS</h2>
  <div class="video" id="video"></div>
  <div class="row" style="margin-top:10px">
    <input id="plUrl" placeholder="Cole o link de uma playlist do YouTube (…list=PL…)" aria-label="Link da playlist">
    <button id="btnPl">Carregar playlist</button>
  </div>
</section>

<script>
// ---- Configuração ----
const DEVICE_NAME = 'LinkGlove-LIBRAS';
const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
const CHAR_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
// Cole aqui o ID da playlist (parte depois de "list=") para já abrir carregada:
const PLAYLIST_ID = '';

// ---- Dados: nome das letras em PT | ES | IT | DE | EN ----
const LANGS = [['🇧🇷','Português','pt-BR'],['🇪🇸','Espanhol','es-ES'],['🇮🇹','Italiano','it-IT'],['🇩🇪','Alemão','de-DE'],['🇬🇧','Inglês','en-US']];
const LN = ('á,a,a,ah,ay|bê,be,bi,beh,bee|cê,ce,ci,tseh,see|dê,de,di,deh,dee|é,e,e,eh,ee|éfe,efe,effe,eff,eff|gê,ge,gi,geh,jee|agá,hache,acca,hah,aych|i,i,i,ih,eye|jota,jota,i lunga,jott,jay|cá,ka,cappa,kah,kay|éle,ele,elle,ell,el|ême,eme,emme,emm,em|êne,ene,enne,enn,en|ó,o,o,oh,oh|pê,pe,pi,peh,pee|quê,cu,cu,kuh,cue|érre,erre,erre,err,ar|ésse,ese,esse,ess,ess|tê,te,ti,teh,tee|u,u,u,uh,you|vê,uve,vu,fau,vee|dáblio,uve doble,doppia vu,weh,double-u|xis,equis,ics,iks,ex|ípsilon,i griega,ipsilon,üpsilon,why|zê,zeta,zeta,tset,zee').split('|').map(s=>s.split(','));

// Dicionário: chave em PT sem acento → [PT, ES, IT, DE, EN]
const DICT = {
OI:['Oi','Hola','Ciao','Hallo','Hi'], OLA:['Olá','Hola','Ciao','Hallo','Hello'],
BOM:['Bom','Bueno','Buono','Gut','Good'], BOA:['Boa','Buena','Buona','Gut','Good'],
DIA:['Dia','Día','Giorno','Tag','Day'], TARDE:['Tarde','Tarde','Pomeriggio','Nachmittag','Afternoon'],
NOITE:['Noite','Noche','Notte','Nacht','Night'], SIM:['Sim','Sí','Sì','Ja','Yes'],
NAO:['Não','No','No','Nein','No'], OBRIGADO:['Obrigado','Gracias','Grazie','Danke','Thank you'],
OBRIGADA:['Obrigada','Gracias','Grazie','Danke','Thank you'], TCHAU:['Tchau','Adiós','Ciao','Tschüss','Bye'],
AGUA:['Água','Agua','Acqua','Wasser','Water'], AMOR:['Amor','Amor','Amore','Liebe','Love'],
AMIGO:['Amigo','Amigo','Amico','Freund','Friend'], FAMILIA:['Família','Familia','Famiglia','Familie','Family'],
CASA:['Casa','Casa','Casa','Haus','House'], COMER:['Comer','Comer','Mangiare','Essen','Eat'],
AJUDA:['Ajuda','Ayuda','Aiuto','Hilfe','Help'], DESCULPA:['Desculpa','Perdón','Scusa','Entschuldigung','Sorry'],
PAZ:['Paz','Paz','Pace','Frieden','Peace'], EU:['Eu','Yo','Io','Ich','I'],
VOCE:['Você','Tú','Tu','Du','You'], TE:['Te','Te','Ti','Dich','You'],
AMO:['Amo','Amo','Amo','Liebe','Love'], LIBRAS:['Libras','Libras','Libras','Libras','Libras'],
PORFAVOR:['Por favor','Por favor','Per favore','Bitte','Please'], BEM:['Bem','Bien','Bene','Gut','Well']
};
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();

// ---- Elementos ----
const $ = id => document.getElementById(id);
const textEl = $('text'), letterEl = $('letter'), statusEl = $('status');
let voiceOn = true, device = null, char = null;

// ---- Cartões e alfabeto ----
$('tr').innerHTML = LANGS.map((l,i)=>`<div class="card"><h3>${l[0]} ${l[1]}</h3><p id="t${i}">–</p><small id="n${i}"></small></div>`).join('');
$('alpha').innerHTML = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(c=>`<div id="a${c}">${c}</div>`).join('');

function translate(){
  const raw = textEl.value.trim();
  const toks = raw ? raw.split(/\s+/) : [];
  const last = letterEl.textContent;
  LANGS.forEach((_,i)=>{
    const out = toks.map(t=>{
      const k = norm(t);
      if (DICT[k]) return DICT[k][i];
      if (k.length===1 && LN[k.charCodeAt(0)-65]) return LN[k.charCodeAt(0)-65][i];
      return t;
    }).join(' ');
    $('t'+i).textContent = out || '–';
    const k = norm(last);
    $('n'+i).textContent = (k.length===1 && LN[k.charCodeAt(0)-65]) ? `Letra ${k}: ${LN[k.charCodeAt(0)-65][i]}` : '';
  });
}

function speak(msg){
  if (!voiceOn || !('speechSynthesis' in window) || !msg) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(msg);
  u.lang = 'pt-BR';
  speechSynthesis.speak(u);
}

function highlight(c){
  document.querySelectorAll('.alpha .hit').forEach(e=>e.classList.remove('hit'));
  const el = $('a'+norm(c)); if (el) el.classList.add('hit');
}

// Recebe o que a luva envia: letra, palavra ou comando (_ / ESPACO = espaço, DEL = apagar)
function onData(msg){
  msg = msg.trim(); if (!msg) return;
  const k = norm(msg);
  if (k==='_' || k==='ESPACO'){ textEl.value += ' '; speak('espaço'); translate(); return; }
  if (k==='DEL' || k==='APAGAR'){ textEl.value = textEl.value.slice(0,-1); translate(); return; }
  letterEl.textContent = msg.toUpperCase();
  highlight(msg);
  textEl.value += msg.length>1 ? (textEl.value && !/\s$/.test(textEl.value) ? ' ' : '') + msg + ' ' : msg;
  speak(msg);
  translate();
}

// ---- Bluetooth ----
function setStatus(on){
  statusEl.textContent = on ? '🟢 Conectado' : '❌ Desconectado';
  statusEl.className = on ? 'on' : 'off';
  $('btnConn').textContent = on ? 'Desconectar' : 'Conectar via Bluetooth';
}
function warn(m){ const w=$('warn'); w.textContent=m; w.style.display=m?'block':'none'; }

async function connect(){
  if (!navigator.bluetooth){ warn('Este navegador não suporta Web Bluetooth. Use Chrome ou Edge no Android ou computador (no iPhone não funciona).'); return; }
  warn('');
  try{
    device = await navigator.bluetooth.requestDevice({filters:[{name:DEVICE_NAME}], optionalServices:[SERVICE_UUID]});
    device.addEventListener('gattserverdisconnected', ()=>setStatus(false));
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    char = await service.getCharacteristic(CHAR_UUID);
    await char.startNotifications();
    char.addEventListener('characteristicvaluechanged', e=>onData(new TextDecoder().decode(e.target.value)));
    setStatus(true);
  }catch(err){
    setStatus(false);
    if (err.name!=='NotFoundError') warn('Não foi possível conectar: '+err.message);
  }
}
$('btnConn').onclick = ()=>{ if (device && device.gatt.connected) device.gatt.disconnect(); else connect(); };

// ---- Botões ----
$('btnClear').onclick = ()=>{ textEl.value=''; letterEl.textContent='–'; highlight('#'); if ('speechSynthesis' in window) speechSynthesis.cancel(); translate(); };
$('btnVoice').onclick = ()=>{
  voiceOn = !voiceOn;
  $('btnVoice').textContent = voiceOn ? '🔊 Voz: Ativada' : '🔇 Voz: Desativada';
  if (!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel();
};
$('btnSpeakAll').onclick = ()=>speak(textEl.value);
textEl.addEventListener('input', translate);

// ---- Vídeo ----
function loadPlaylist(id){
  const box = $('video');
  if (!id){
    box.innerHTML = '<div class="empty"><p>Cole acima o link de uma playlist de LIBRAS (por exemplo, da TV INES) para assistir aqui.</p><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=TV+INES+aulas+de+Libras+playlist">Procurar videoaulas no YouTube</a></div>';
    return;
  }
  box.innerHTML = `<iframe src="https://www.youtube.com/embed/videoseries?list=${encodeURIComponent(id)}" title="Videoaulas de LIBRAS" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
}
$('btnPl').onclick = ()=>{
  const v = $('plUrl').value.trim();
  const m = v.match(/[?&]list=([\w-]+)/);
  loadPlaylist(m ? m[1] : (/^[\w-]{10,}$/.test(v) ? v : ''));
};

loadPlaylist(PLAYLIST_ID);
translate();
</script>
</body>
</html>
